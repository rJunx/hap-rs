# FORK: stable rustfmt only, like the rs-home workspace that builds this. Upstream's config was
# nightly-only (`unstable_features` plus a dozen options, among them the `ignore` list that kept
# codegen output unformatted); now everything is formatted, generated files included. See FORK.md #24.
style_edition = "2024"
max_width = 120
match_block_trailing_comma = true
use_field_init_shorthand = true
use_try_shorthand = true
